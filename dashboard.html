<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tastee Kreme Houston – Manager Dashboard</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--blue:#1565C0;--blue2:#1976D2;--lblue:#E3F2FD;--green:#2e7d32;--red:#c62828;--gray:#6b7280;--border:#e5e7eb;--bg:#f5f7fa}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:#111}
    .header{background:var(--blue);color:white;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.2)}
    .header-left{display:flex;align-items:center;gap:12px}
    .header-icon{font-size:2rem}
    .header-title{font-size:1.2rem;font-weight:700}
    .header-sub{font-size:.8rem;opacity:.8;margin-top:2px}
    .controls{background:white;border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    .controls label{font-size:.85rem;font-weight:600;color:#374151}
    .controls select,.controls input[type="date"]{padding:8px 12px;border:2px solid var(--border);border-radius:8px;font-size:.9rem;background:white}
    .controls select:focus,.controls input:focus{outline:none;border-color:var(--blue)}
    .btn{padding:9px 20px;border:none;border-radius:8px;font-size:.9rem;font-weight:700;cursor:pointer;transition:all .15s}
    .btn-blue{background:var(--blue);color:white} .btn-blue:hover{background:var(--blue2)}
    .btn-outline{background:white;color:var(--blue);border:2px solid var(--blue)} .btn-outline:hover{background:var(--lblue)}
    .btn-email{background:#2e7d32;color:white} .btn-email:hover{background:#1b5e20}
    .main{padding:24px 28px;max-width:1400px;margin:0 auto}
    .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:24px}
    .stat-card{background:white;border:1px solid var(--border);border-radius:14px;padding:20px;text-align:center;box-shadow:0 1px 6px rgba(0,0,0,.05)}
    .stat-n{font-size:2.4rem;font-weight:700;line-height:1}
    .stat-l{font-size:.85rem;color:var(--gray);margin-top:6px}
    .c-blue{color:var(--blue)} .c-red{color:var(--red)} .c-grn{color:var(--green)} .c-org{color:#e65100}
    .route-section{margin-bottom:24px}
    .section-title{font-size:1rem;font-weight:700;color:#374151;margin-bottom:12px}
    .route-pills{display:flex;flex-wrap:wrap;gap:8px}
    .route-pill{display:flex;align-items:center;gap:8px;background:white;border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:.85rem;box-shadow:0 1px 4px rgba(0,0,0,.05)}
    .route-pill .rname{font-weight:600;color:#1f2937}
    .route-pill .rcount{color:var(--gray)}
    .route-pill .rice{background:#fee2e2;color:#991b1b;padding:1px 8px;border-radius:10px;font-weight:700;font-size:.8rem}
    .route-pill .rclean{background:#dcfce7;color:#166534;padding:1px 8px;border-radius:10px;font-weight:700;font-size:.8rem}
    .table-wrap{background:white;border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.05)}
    .table-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
    .table-header h3{font-size:1rem;color:#1f2937}
    .record-count{font-size:.85rem;color:var(--gray)}
    table{width:100%;border-collapse:collapse}
    thead th{background:#f9fafb;padding:11px 14px;text-align:left;font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--gray);border-bottom:2px solid var(--border)}
    tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
    tbody tr:hover{background:#fafafa}
    tbody tr:last-child{border-bottom:none}
    tbody tr.row-ice{background:#fff5f5}
    tbody tr.row-ice:hover{background:#fee2e2}
    td{padding:11px 14px;font-size:.9rem;vertical-align:middle}
    .badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.78rem;font-weight:700}
    .badge-ice{background:#fee2e2;color:#991b1b}
    .badge-clean{background:#dcfce7;color:#166534}
    .badge-unknown{background:#f3f4f6;color:#6b7280}
    .sev-none{color:#16a34a;font-weight:600} .sev-light{color:#ca8a04;font-weight:600}
    .sev-moderate{color:#ea580c;font-weight:600} .sev-heavy{color:#dc2626;font-weight:600}
    .sev-unknown{color:#9ca3af;font-weight:600}
    .photo-thumb{width:56px;height:44px;object-fit:cover;border-radius:6px;cursor:pointer;border:2px solid var(--border);transition:transform .15s,box-shadow .15s}
    .photo-thumb:hover{transform:scale(1.08);box-shadow:0 2px 10px rgba(0,0,0,.15)}
    .empty-state{text-align:center;padding:60px 20px;color:var(--gray)}
    .empty-icon{font-size:3rem;margin-bottom:12px}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;align-items:center;justify-content:center;padding:20px}
    .modal-overlay.open{display:flex}
    .modal{background:white;border-radius:16px;max-width:700px;width:100%;padding:24px;box-shadow:0 8px 40px rgba(0,0,0,.25)}
    .modal-img{width:100%;border-radius:10px;margin-bottom:14px}
    .modal h3{font-size:1.1rem;margin-bottom:8px}
    .modal p{font-size:.9rem;color:#374151;line-height:1.55}
    .modal-close{float:right;background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--gray)}
    .toast{position:fixed;bottom:24px;right:24px;background:#1f2937;color:white;padding:12px 20px;border-radius:10px;font-size:.9rem;box-shadow:0 4px 16px rgba(0,0,0,.2);z-index:2000;transform:translateY(80px);opacity:0;transition:all .3s}
    .toast.show{transform:translateY(0);opacity:1}
    .toast.success{background:#166534} .toast.error{background:#991b1b}
    @media(max-width:640px){.controls{padding:12px 16px}.main{padding:16px}th:nth-child(5),td:nth-child(5),th:nth-child(6),td:nth-child(6){display:none}}
  </style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <div class="header-icon">🍦</div>
    <div>
      <div class="header-title">Tastee Kreme Houston</div>
      <div class="header-sub">Manager Dashboard – Freezer Inspections</div>
    </div>
  </div>
  <div style="display:flex;gap:10px;flex-wrap:wrap">
    <a href="/" target="_blank"><button class="btn btn-outline">📱 Open Field App</button></a>
    <button class="btn btn-email" onclick="sendReport()">📧 Send Daily Report</button>
  </div>
</div>

<div class="controls">
  <label>Date:</label><input type="date" id="date-picker">
  <label>Zone:</label>
  <select id="route-filter">
    <option value="">All Zones</option>
    <option>Zone 1</option><option>Zone 2</option><option>Zone 3</option>
    <option>Zone 4</option><option>Zone 5</option><option>Zone 6</option>
    <option>Zone 7</option><option>Zone 8</option><option>Zone 9</option>
  </select>
  <button class="btn btn-blue" onclick="loadData()">🔄 Refresh</button>
</div>

<div class="main">
  <div class="stats-row">
    <div class="stat-card"><div class="stat-n c-blue" id="stat-total">—</div><div class="stat-l">Total Checked</div></div>
    <div class="stat-card"><div class="stat-n c-red"  id="stat-ice">—</div><div class="stat-l">Ice Detected</div></div>
    <div class="stat-card"><div class="stat-n c-grn"  id="stat-clean">—</div><div class="stat-l">Clean</div></div>
    <div class="stat-card"><div class="stat-n c-org"  id="stat-needs">—</div><div class="stat-l">Need Cleaning</div></div>
  </div>
  <div class="route-section">
    <div class="section-title">Zone Breakdown</div>
    <div class="route-pills" id="route-pills"><span style="color:#9ca3af;font-size:.9rem">Loading…</span></div>
  </div>
  <div class="table-wrap">
    <div class="table-header">
      <h3>Submission Log</h3>
      <span class="record-count" id="record-count"></span>
    </div>
    <table>
      <thead><tr><th>Time</th><th>Zone</th><th>Store</th><th>Status</th><th>Severity</th><th>Rep</th><th>AI Notes</th><th>Photo</th></tr></thead>
      <tbody id="table-body"><tr><td colspan="8"><div class="empty-state"><div class="empty-icon">📋</div><p>Loading…</p></div></td></tr></tbody>
    </table>
  </div>
</div>

<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal">
    <button class="modal-close" onclick="document.getElementById('modal').classList.remove('open')">✕</button>
    <img id="modal-img" class="modal-img" src="" alt="Freezer photo">
    <h3 id="modal-store"></h3><p id="modal-notes"></p>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('date-picker').value = today;
  loadData();
  setInterval(loadData, 60000);

  async function loadData() {
    const date=document.getElementById('date-picker').value||today;
    const route=document.getElementById('route-filter').value;
    const [subResp,statsResp] = await Promise.all([
      fetch(`/api/submissions?date=${date}&route=${encodeURIComponent(route)}`),
      fetch(`/api/stats?date=${date}`)
    ]);
    const submissions=await subResp.json(), statsData=await statsResp.json();
    renderStats(statsData.stats||{});
    renderRoutes(statsData.byRoute||[]);
    renderTable(submissions);
  }

  function renderStats(s) {
    document.getElementById('stat-total').textContent=s.total||0;
    document.getElementById('stat-ice').textContent=s.with_ice||0;
    document.getElementById('stat-clean').textContent=s.clean||0;
    document.getElementById('stat-needs').textContent=s.needs_cleaning||0;
  }

  function renderRoutes(routes) {
    const c=document.getElementById('route-pills');
    if (!routes.length){c.innerHTML='<span style="color:#9ca3af;font-size:.9rem">No submissions yet.</span>';return;}
    c.innerHTML=routes.map(r=>`<div class="route-pill"><span class="rname">${r.route_name}</span><span class="rcount">${r.total} checked</span>${r.with_ice>0?`<span class="rice">🧊 ${r.with_ice} ice</span>`:'<span class="rclean">✅ clean</span>'}</div>`).join('');
  }

  function renderTable(submissions) {
    const tbody=document.getElementById('table-body');
    document.getElementById('record-count').textContent=`${submissions.length} record${submissions.length!==1?'s':''}`;
    if (!submissions.length){tbody.innerHTML=`<tr><td colspan="8"><div class="empty-state"><div class="empty-icon">📋</div><p>No submissions found.</p></div></td></tr>`;return;}
    tbody.innerHTML=submissions.map(s=>{
      const isIce=s.has_ice_buildup;
      const time=new Date(s.submitted_at).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
      const badge=isIce?'<span class="badge badge-ice">🧊 Ice</span>':s.has_ice_buildup===null?'<span class="badge badge-unknown">?</span>':'<span class="badge badge-clean">✅ Clean</span>';
      const sev=s.ice_severity||'none';
      const photo=s.image_filename?`<img class="photo-thumb" src="/uploads/${s.image_filename}" alt="photo" onclick='openModal("/uploads/${s.image_filename}",${JSON.stringify(s.store_identifier)},${JSON.stringify(s.ai_notes||'')})'>` :'<span style="color:#9ca3af;font-size:.8rem">—</span>';
      return `<tr class="${isIce?'row-ice':''}"><td>${time}</td><td>${s.route_name}</td><td><strong>${s.store_identifier}</strong><br><span style="font-size:.78rem;color:#9ca3af">${s.store_type==='address'?'Address':'Acct #'}</span></td><td>${badge}</td><td><span class="sev-${sev}">${sev.charAt(0).toUpperCase()+sev.slice(1)}</span></td><td>${s.rep_name||'<span style="color:#9ca3af">—</span>'}</td><td style="max-width:220px;font-size:.83rem;color:#374151">${s.ai_notes||'<span style="color:#9ca3af">—</span>'}</td><td>${photo}</td></tr>`;
    }).join('');
  }

  async function sendReport() {
    const date=document.getElementById('date-picker').value||today;
    const btn=document.querySelector('.btn-email');
    btn.disabled=true; btn.textContent='⏳ Sending…';
    try {
      const resp=await fetch(`/api/send-report?date=${date}`,{method:'POST'});
      const data=await resp.json();
      if (!resp.ok) throw new Error(data.error);
      showToast('✅ '+data.message,'success');
    } catch(err){showToast('❌ '+err.message,'error');}
    finally{btn.disabled=false;btn.textContent='📧 Send Daily Report';}
  }

  function openModal(src,store,notes){document.getElementById('modal-img').src=src;document.getElementById('modal-store').textContent=store;document.getElementById('modal-notes').textContent=notes||'';document.getElementById('modal').classList.add('open');}
  function closeModal(e){if(e.target.id==='modal')document.getElementById('modal').classList.remove('open');}
  function showToast(msg,type=''){const t=document.getElementById('toast');t.textContent=msg;t.className='toast '+type;setTimeout(()=>t.classList.add('show'),10);setTimeout(()=>t.classList.remove('show'),4000);}
</script>
</body>
</html>
